<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nudge" />
    <meta name="theme-color" content="#f6f5f4" />
    <meta name="description" content="Swipe what matters" />
    <title>Nudge</title>
    <style>
      html { background: #f6f5f4; }
      #launch { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; pointer-events: none; font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif; animation: l-fallback 0s linear 12s forwards; }
      #launch::before { content: ""; position: absolute; inset: 0; background: #f6f5f4; transition: opacity 360ms ease 440ms; }
      #launch.leaving::before { opacity: 0; }
      #launch .stage { position: relative; display: grid; justify-items: center; animation: l-in 600ms cubic-bezier(.22,1,.36,1) both; }
      #launch.leaving .stage { animation: l-out 440ms cubic-bezier(.4,0,.2,1) forwards; }
      #launch svg { width: 124px; height: 124px; overflow: visible; filter: drop-shadow(0 14px 18px rgba(8,90,84,.22)); }
      #launch .tile { transform-box: fill-box; transform-origin: 50% 50%; animation: l-tile 420ms cubic-bezier(.34,1.56,.64,1) both; }
      /* Both cards turn around the bottom, like a hand that deals them. */
      #launch .back, #launch .front { transform-origin: 410px 750px; }
      #launch .back { transform: rotate(-8deg); animation: l-back 480ms cubic-bezier(.34,1.4,.64,1) 200ms both; }
      #launch .front { transform: rotate(13deg); animation: l-front 620ms cubic-bezier(.34,1.5,.64,1) 420ms both, l-nudge 1500ms ease-in-out 2600ms infinite; }
      #launch .word { margin-top: 24px; color: #0a3f3b; animation: l-word 380ms cubic-bezier(.22,1,.36,1) 760ms both; }
      .wordmark { display: block; fill: currentColor; }
      #launch .wordmark { width: 132px; height: auto; filter: none; }
      .slogan { display: block; width: 100%; overflow: visible; }
      .slogan path { fill: none; stroke: currentColor; stroke-width: 7.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 2; animation: l-write var(--d) linear calc(var(--t) + 900ms) both; }
      #launch .slogan { width: min(290px, 76vw); height: auto; margin-top: 12px; filter: none; color: #0b6b64; }
      @keyframes l-in { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
      @keyframes l-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(1.05); } }
      @keyframes l-tile { from { opacity: 0; transform: scale(.6); } }
      @keyframes l-back { from { opacity: 0; transform: translateY(160px) rotate(0); } }
      @keyframes l-front { from { opacity: 0; transform: translateY(160px) rotate(-14deg); } }
      @keyframes l-nudge { 50% { transform: rotate(18deg); } }
      @keyframes l-word { from { opacity: 0; transform: translateY(8px); } }
      @keyframes l-write { from { stroke-dashoffset: 1.05; visibility: hidden; } 1% { visibility: visible; } to { stroke-dashoffset: 0; } }
      @keyframes l-fade { to { opacity: 0; } }
      @keyframes l-fallback { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        #launch .tile, #launch .back, #launch .front, #launch .word, .slogan path { animation: none; }
        #launch .stage { animation: l-fade 300ms ease reverse both; }
        #launch.leaving .stage { animation: l-fade 300ms ease forwards; }
      }
    </style>
  </head>
  <body>
    <div id="launch" aria-hidden="true">
      <div class="stage">
        <svg viewBox="0 0 1024 1024">
          <defs>
            <linearGradient id="l-field" x2="0" y2="1"><stop stop-color="#159F91" /><stop offset="1" stop-color="#087A75" /></linearGradient>
            <linearGradient id="l-bg" x2="0" y2="1"><stop stop-color="#A3F1CE" /><stop offset="1" stop-color="#65DCA9" /></linearGradient>
            <linearGradient id="l-fg" x2="0" y2="1"><stop stop-color="#FFFFFC" /><stop offset="1" stop-color="#EAF9EE" /></linearGradient>
          </defs>
          <rect class="tile" width="1024" height="1024" rx="230" fill="url(#l-field)" />
          <g transform="translate(17.5 7.5)">
            <rect class="back" x="249" y="217" width="424" height="565" rx="76" fill="url(#l-bg)" />
            <g class="front">
              <rect x="290" y="218" width="414" height="552" rx="75" fill="#075F52" opacity=".16" />
              <rect x="290" y="210" width="414" height="552" rx="75" fill="url(#l-fg)" />
            </g>
          </g>
        </svg>
        <div class="word"><!--wordmark--></div>
        <!--slogan-->
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
