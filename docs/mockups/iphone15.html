<title>光疊手機模擬</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one phone centered on a quiet stage, switches above it. Phone contents keep one light look. */
:root{--stage:#e6e7ea;--ink:#1c1c1e;--quiet:#55565c;--chip:#fff;--focus:#0062cc;--ui:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--stage:#17181b;--ink:#f2f2f7;--quiet:#b3b4ba;--chip:#34353a;--focus:#64b5ff;color-scheme:dark}}
:root[data-theme="dark"]{--stage:#17181b;--ink:#f2f2f7;--quiet:#b3b4ba;--chip:#34353a;--focus:#64b5ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font:15px/1.5 var(--ui);display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
button,textarea{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
p,h1,h2{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.switches{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 24px;flex:none}
.group{display:flex;align-items:center}
.group span{color:var(--quiet);margin-right:6px;font-size:13px}
.group button{min-height:44px;padding:0 12px;border-radius:22px;color:var(--quiet)}
.group [aria-pressed=true]{background:var(--chip);color:var(--ink);font-weight:600}
.fit{flex:none;position:relative}
.frame{position:absolute;left:0;top:0;width:405px;height:864px;padding:6px;border-radius:61px;background:#0b0b0c;box-shadow:0 0 0 .5px #8b8d92,0 0 0 2px #c9cbd0,0 30px 60px -24px rgba(0,0,0,.5);transform-origin:0 0}
.key{position:absolute;width:3px;background:#aeb0b5;border-radius:2px}
.screen{color-scheme:light;position:relative;width:393px;height:852px;border-radius:55px;overflow:hidden;background:#f6f5f4;color:#1c1c1e;isolation:isolate;--safe:34px;--top:59px}
.screen.safari{--safe:86px}
.status{position:absolute;z-index:40;inset:0 0 auto;height:59px;background:#f6f5f4;display:flex;justify-content:space-between;align-items:center;padding:6px 32px 0 50px;font-weight:600;font-size:17px;pointer-events:none}
.status b{position:absolute;left:50%;top:11px;width:126px;height:37px;margin-left:-63px;border-radius:19px;background:#000}
.status svg{width:66px;height:14px}
.home{position:absolute;z-index:50;left:50%;bottom:8px;width:139px;height:5px;margin-left:-69.5px;border-radius:3px;background:#1c1c1e;pointer-events:none}
.bar{position:absolute;z-index:45;left:22px;right:22px;bottom:26px;height:48px;display:none;gap:8px;pointer-events:none;font-size:15px}
.safari .bar{display:flex}
.bar i{flex:none;width:48px;border-radius:24px;display:grid;place-items:center;font-style:normal}
.bar span{flex:1;border-radius:24px;display:grid;place-items:center}
.bar i,.bar span{background:rgba(250,250,250,.72);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 0 0 .5px rgba(60,60,67,.16),0 6px 18px -8px rgba(20,24,32,.35)}
.page{position:absolute;inset:var(--top) 0 0;overflow:hidden;--q:0;--r:0;--l:0;isolation:isolate}
.light{position:absolute;inset:0;isolation:isolate;overflow:hidden}
.light div{position:absolute;inset:-80px;background-size:cover;background-position:center;opacity:.9}
.light::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(#f6f5f4,rgba(255,255,255,.25) 16px,rgba(255,255,255,.08) 45%,rgba(255,255,255,.3))}
.deck{position:absolute;inset:12px 20px calc(var(--safe) + 64px)}
.card{position:absolute;inset:0;overflow:hidden;border-radius:30px;background:#fff;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;will-change:transform;box-shadow:0 0 0 .5px rgba(255,255,255,.7),0 2px 6px rgba(20,24,32,.06),0 26px 50px -24px rgba(20,24,32,.5)}
.ambient{position:absolute;inset:-50px;background-size:cover;background-position:center;filter:blur(36px) saturate(1.2)}
.ambient::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.68)}
.text .ambient{filter:none;inset:0}
.text .ambient::after{background:rgba(255,255,255,.35)}
.image .ambient::after{background:rgba(255,255,255,.12)}
.scroll{position:absolute;inset:0;padding-bottom:40px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;display:flex;flex-direction:column}
.scroll::before,.scroll::after{content:"";margin:auto}
.card img{width:100%;min-height:0;flex:0 1 auto;object-fit:contain;pointer-events:none}
.card p{flex:none;padding:22px 26px;font-size:17px;line-height:1.75;white-space:pre-line;overflow-wrap:anywhere}
.text p{padding:30px}
.short p{font-size:28px;font-weight:600;line-height:1.5}
.both p{font-size:20px;font-weight:600;line-height:1.55}
.sheen{position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 .5px 0 rgba(255,255,255,.95),inset 0 0 0 .5px rgba(255,255,255,.4);background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.3) 50%,transparent 62%) no-repeat calc(50% - var(--x,0)*130%) 0/260% 100%;opacity:calc(var(--r) + var(--l))}
.edge{position:absolute;z-index:8;top:0;bottom:0;width:20%;pointer-events:none;opacity:0}
.er{right:0;opacity:var(--r);background:radial-gradient(ellipse at 100% 45%,rgba(255,143,92,.8),rgba(255,143,92,0) 70%)}
.el{left:0;opacity:var(--l);background:radial-gradient(ellipse at 0 45%,rgba(94,112,150,.6),rgba(94,112,150,0) 70%)}
.yes path{fill:#e2552a;fill-opacity:var(--r)}
.yes{transform:scale(calc(1 + var(--r)*.2 - var(--l)*.12))}
.no{transform:scale(calc(1 + var(--l)*.2 - var(--r)*.12))}
.settle .edge,.settle .yes,.settle .no,.settle .sheen{transition:opacity 240ms,transform 260ms cubic-bezier(.22,1,.36,1)}
/* Full view: the page itself is the screen, for swiping on a real phone */
.full{padding:0;gap:0}
.full .fit{flex:1;min-height:0;width:100%!important;max-width:480px;height:auto!important}
.full .frame{inset:0;width:auto;height:auto;padding:0;border-radius:0;box-shadow:none;transform:none!important}
.full .screen{width:100%;height:100%;border-radius:0}
.full .screen,.full .screen.safari{--top:0px;--safe:env(safe-area-inset-bottom,0px)}
.full .status,.full .home,.full .safari .bar,.full .key,.full .env{display:none}
@media (prefers-reduced-motion:reduce){.yes,.no{transform:none!important}.settle *{transition:none!important}}

/* Glass: clear center, bright rim, refraction shade. It overlaps the card so there is something to see through. */
.glass{position:relative;border-radius:50%;display:grid;place-items:center;color:#2c2c2e;isolation:isolate;overflow:hidden;
background:linear-gradient(150deg,rgba(255,255,255,.5),rgba(255,255,255,.1) 45%,rgba(255,255,255,.3));
-webkit-backdrop-filter:blur(7px) saturate(190%) brightness(1.1);backdrop-filter:blur(7px) saturate(190%) brightness(1.1);
box-shadow:inset 1.5px 1.5px 1px rgba(255,255,255,.95),inset -1.5px -1.5px 1px rgba(255,255,255,.6),inset 0 0 0 .5px rgba(255,255,255,.75),inset 0 -9px 14px -8px rgba(255,255,255,.65),inset 5px 8px 14px -10px rgba(40,50,70,.3),0 0 0 .5px rgba(40,50,70,.12),0 12px 24px -10px rgba(20,24,32,.45)}
.glass::before{content:"";position:absolute;z-index:-1;left:14%;right:14%;top:4%;height:40%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,0))}
.glass svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(255,255,255,.84)}}
.page .corner{position:absolute;z-index:10;bottom:calc(var(--safe) - 10px);width:50px;height:50px}
.corner.add{left:18px}.corner.all{right:18px}
.page .no,.page .yes{position:absolute;z-index:10;bottom:calc(var(--safe) + 18px);left:50%;width:62px;height:62px}
.no{margin-left:-76px}.yes{margin-left:14px;color:#a8401c}
.page .no svg,.page .yes svg{width:27px;height:27px}
.why{height:20px;color:var(--quiet);font-size:13px}
.full .why{display:none}
/* Composed card: a fixed 2:3 sheet, so a layout looks the same everywhere */
.art{position:relative;width:100%;aspect-ratio:2/3;flex:none;overflow:hidden;container-type:inline-size}
.card .art img,.art img{position:absolute;max-width:none;height:auto;transform:translate(-50%,-50%);border-radius:0}
.card .art p,.art p{position:absolute;width:86%;padding:0;transform:translate(-50%,-50%);text-align:center;font-weight:600;line-height:1.5;white-space:pre-line;overflow-wrap:anywhere;font-size:calc(var(--size)*1cqw)}
.art p span{-webkit-box-decoration-break:clone;box-decoration-break:clone}
.art p.ink{color:#1c1c1e}.art p.paper{color:#fff}
.art p.plate span{padding:.12em .4em;border-radius:.3em}
.art p.ink.plate span{background:rgba(255,255,255,.78)}.art p.paper.plate span{background:rgba(0,0,0,.5)}
/* Views */
.view{position:absolute;z-index:20;inset:0;background:#f6f5f4;overflow:hidden;display:flex;flex-direction:column}
.view header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:4px 20px}
.view h2{font-size:26px}
.body{flex:1;min-height:0;overflow-y:auto;padding:4px 20px calc(var(--safe) + 64px);scrollbar-width:none}
.pill{border-radius:24px;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;font-weight:600}
.pill svg{width:19px;height:19px}.pill::before{border-radius:20px;left:6%;right:6%}
.round{width:46px;height:46px;flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}
.tile{display:block;text-align:left;width:100%;border-radius:18px}
.thumb{display:grid;place-items:center;aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:#ecebe9 center/cover;font-size:16px;line-height:1.5;padding:16px}
.thumb.pic{padding:0}.thumb>img{width:100%;height:100%;object-fit:contain}
.thumb .art{width:auto;height:100%}
.meta{display:flex;justify-content:space-between;padding:6px 4px 0;font-size:13px;color:#5c5c61;font-variant-numeric:tabular-nums}
.meta b{color:#1c1c1e}
.menu{position:absolute;z-index:5;top:58px;right:20px;width:216px;border-radius:22px;padding:6px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 1px 1px 0 #fff,0 0 0 .5px rgba(40,50,70,.14),0 18px 40px -14px rgba(20,24,32,.45)}
.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:44px;padding:0 14px;border-radius:16px;font-size:16px}
.menu [aria-checked=true]{font-weight:600;background:rgba(118,118,128,.12)}
.menu hr{border:0;border-top:.5px solid rgba(60,60,67,.2);margin:6px 8px}
.hero{width:232px;margin:0 auto 22px;border-radius:24px;overflow:hidden;box-shadow:0 22px 44px -22px rgba(20,24,32,.5)}
.hero .thumb{border-radius:0}
.big{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.big b{font-size:44px;line-height:1.1;font-weight:700}
.ratio{display:flex;gap:3px;height:10px;margin:10px 0 8px}
.ratio i{border-radius:5px;min-width:0}.ratio .a{background:#d9693f}.ratio .z{background:#a9b1bf}
.sides{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
dl{margin:22px 0;display:grid;grid-template-columns:auto 1fr;gap:0;font-variant-numeric:tabular-nums}
dt,dd{margin:0;padding:11px 0;border-top:.5px solid rgba(60,60,67,.2)}
dt{color:#5c5c61}dd{text-align:right}
.danger{width:100%;min-height:50px;border-radius:25px;background:rgba(118,118,128,.1);color:#b3261e;font-weight:600}
.scrim{position:absolute;z-index:30;inset:0;background:rgba(0,0,0,.3)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;padding:26px 20px calc(var(--safe) + 12px);display:grid;gap:10px}
.sheet p{font-size:17px;font-weight:600;text-align:center;margin-bottom:8px}
.sheet button{min-height:50px;border-radius:25px;background:rgba(118,118,128,.12);font-weight:600}
.sheet .go{background:#b3261e;color:#fff}
.toast{position:absolute;z-index:35;left:50%;top:14px;transform:translateX(-50%);padding:9px 18px;border-radius:20px;background:#1c1c1e;color:#fff;font-weight:600;white-space:nowrap}
.empty{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;font-size:20px;font-weight:600}
/* Editor */
.canvas{width:220px;margin:0 auto;border-radius:22px;overflow:hidden;background:#fff center/cover;box-shadow:0 18px 36px -20px rgba(20,24,32,.5);touch-action:none;user-select:none;-webkit-user-select:none}
.canvas .art img,.canvas .art p{cursor:move;touch-action:none}
.canvas .hint{position:absolute;inset:0;display:grid;place-content:center;color:#5c5c61}
.canvas .longtext{height:330px;overflow-y:auto;padding:18px;font-size:13px;white-space:pre-line}
.canvas .on{outline:1.5px dashed rgba(60,60,67,.55);outline-offset:3px}
.tools{display:grid;gap:10px;margin-top:16px}
.tools .row{display:flex;align-items:center;gap:10px}
.tools label.slide{display:grid;grid-template-columns:72px 1fr;align-items:center;min-height:36px}
.tools input[type=range]{width:100%;accent-color:#48484c;height:28px}
.tools textarea{display:block;width:100%;height:68px;padding:10px 14px;border:1px solid #c7c7cc;border-radius:16px;font-size:17px;background:#fff;color:#1c1c1e;resize:none}
.chip{min-height:44px;padding:0 16px;border-radius:22px;background:rgba(118,118,128,.12);font-weight:600;display:inline-flex;align-items:center;cursor:pointer}
.chip[aria-pressed=true]{background:#1c1c1e;color:#fff}
.chip:focus-within{outline:3px solid #0062cc;outline-offset:2px}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.err{color:#b3261e}
.primary{min-height:50px;width:100%;border-radius:25px;background:#1c1c1e;color:#fff;font-weight:600}
.primary:disabled{background:#8a8a8e}
.view .foot{flex:none;padding:8px 20px calc(var(--safe) + 4px)}
.preview{background:none;overflow:hidden}
.preview .light{z-index:-1}
.preview .deck .card{cursor:default}
.preview .acts{position:absolute;left:0;right:0;bottom:calc(var(--safe) + 22px);display:flex;justify-content:center;gap:14px}
.acts .pill{height:54px;padding:0 24px;border-radius:27px}
.view.preview{background:#f6f5f4}
.art p,.short p{text-wrap:balance}
</style>

// Which card comes next, and how the collection is sorted. Pure: pass in time and randomness.
// Card fields: likes, skips (lifetime counts), likeScore, skipScore (counts that fade), lastSeenAt, createdAt.

const DAY = 86_400_000;
const HALF_LIFE = 90 * DAY; // an opinion counts half after 90 days
const SLOTS = { fresh: 0.2, lost: 0.15, wild: 0.05 }; // the rest goes to taste

const seenCount = (c) => (c.likes || 0) + (c.skips || 0);
const likeRatio = (c) => (seenCount(c) ? (c.likes || 0) / seenCount(c) : null);

function faded(card, now) {
  const f = card.lastSeenAt ? 0.5 ** (Math.max(now - card.lastSeenAt, 0) / HALF_LIFE) : 1;
  return { like: (card.likeScore ?? card.likes ?? 0) * f, skip: (card.skipScore ?? card.skips ?? 0) * f };
}

/** Expected chance of a like, 0 to 1. An unseen card starts at 0.5. */
function taste(card, now) {
  const { like, skip } = faded(card, now);
  return (1 + like) / (2 + like + skip);
}

/** Fields that one swipe changes. */
function recordSwipe(card, direction, now) {
  const { like, skip } = faded(card, now);
  const liked = direction === "right";
  return {
    likes: (card.likes || 0) + (liked ? 1 : 0),
    skips: (card.skips || 0) + (liked ? 0 : 1),
    likeScore: like + (liked ? 1 : 0),
    skipScore: skip + (liked ? 0 : 1),
    lastSeenAt: now,
  };
}

/** 0 right after a view, back to 1 with time. Loved cards recover in hours, skipped ones in days. */
function rested(card, now) {
  if (!card.lastSeenAt) return 1;
  const days = 7 * (0.25 / 7) ** taste(card, now);
  return 1 - Math.exp(-Math.max(now - card.lastSeenAt, 0) / (days * DAY));
}

function normal(random) {
  return Math.sqrt(-2 * Math.log(1 - random())) * Math.cos(2 * Math.PI * random());
}
// Marsaglia-Tsang, valid for shape >= 1.
function gamma(shape, random) {
  const d = shape - 1 / 3;
  const c = 1 / Math.sqrt(9 * d);
  for (;;) {
    const x = normal(random);
    const v = (1 + c * x) ** 3;
    if (v > 0 && Math.log(1 - random()) < 0.5 * x * x + d - d * v + d * Math.log(v)) return d * v;
  }
}
function sampleBeta(a, b, random) {
  const x = gamma(a, random);
  return x / (x + gamma(b, random));
}

const pickOne = (list, random) => list[Math.floor(random() * list.length)];

/**
 * Returns { card, reason } or null. reason: "fresh" | "lost" | "wild" | "taste".
 * recentIds: newest last. The latest cards are held back, so a small library never loops tightly.
 */
function chooseNext(cards, { now, recentIds = [], random = Math.random }) {
  if (cards.length === 0) return null;
  const hold = Math.min(6, Math.floor((cards.length - 1) / 2));
  const floor = cards.length > 1 ? Math.max(hold, 1) : 0;
  const held = new Set(floor ? recentIds.slice(-floor) : []);
  const pool = cards.filter((c) => !held.has(c.id));

  const roll = random();
  if (roll < SLOTS.fresh) {
    const fresh = pool.filter((c) => seenCount(c) < 3);
    const least = Math.min(...fresh.map(seenCount));
    if (fresh.length) return { card: pickOne(fresh.filter((c) => seenCount(c) === least), random), reason: "fresh" };
  } else if (roll < SLOTS.fresh + SLOTS.lost) {
    const lost = pool.filter((c) => c.lastSeenAt && now - c.lastSeenAt > 14 * DAY && taste(c, now) >= 0.5);
    if (lost.length) return { card: lost.reduce((a, b) => (a.lastSeenAt < b.lastSeenAt ? a : b)), reason: "lost" };
  } else if (roll < SLOTS.fresh + SLOTS.lost + SLOTS.wild) {
    return { card: pickOne(pool, random), reason: "wild" };
  }
  let best = null;
  for (const card of pool) {
    const { like, skip } = faded(card, now);
    const score = sampleBeta(1 + like, 1 + skip, random) * (0.02 + 0.98 * rested(card, now));
    if (!best || score > best.score) best = { card, score };
  }
  return { card: best.card, reason: "taste" };
}

/** Wilson lower bound (95%): one like out of one does not beat nineteen out of twenty. */
function likeConfidence(card) {
  const n = seenCount(card);
  if (!n) return -1;
  const z = 1.96;
  const p = likeRatio(card);
  return (p + z * z / (2 * n) - z * Math.sqrt((p * (1 - p) + z * z / (4 * n)) / n)) / (1 + z * z / n);
}

const SORT_KEYS = {
  ratio: likeConfidence,
  likes: (c) => c.likes || 0,
  seen: seenCount,

function sortCards(cards, key = "ratio", ascending = false) {

}

/* Views stack: opening one freezes everything below, closing restores exactly that state. */

  rest.forEach(([c]) => { c.inert = true; });
  page.append(view);
  if (!reduced.matches) view.animate([{ transform: "translateY(24px)" }, { transform: "none" }], { duration: 220, easing: "cubic-bezier(.22,1,.36,1)" });

  view.onEscape = onEscape || close;
  return close;
}

function openDetail(id, changed) {

/* Add: edit, then preview, then save */
const LONG = 100;
async function readImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const i = new Image(); i.src = url; await i.decode();
    const k = Math.min(1, 1400 / Math.max(i.naturalWidth, i.naturalHeight)), c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(i.naturalWidth * k)); c.height = Math.max(1, Math.round(i.naturalHeight * k));
    c.getContext("2d").drawImage(i, 0, 0, c.width, c.height);
    return { url: c.toDataURL(file.type === "image/png" ? "image/png" : "image/jpeg", .88), ratio: c.height / c.width };
  } finally { URL.revokeObjectURL(url); }
}
function openAdd() {
  const draft = { id: "new-" + Date.now(), content: "", link: "", imageUrl: null, likes: 0, skips: 0, art: { image: { x: 50, y: 50, s: 100 }, text: { x: 50, y: 50, size: 9, color: "ink", plate: false } } };
  const v = el(`<div class="view" role="dialog" aria-label="新增卡片"><header>${glass("no", "取消", "round")}<h2>新增</h2><span class="round"></span></header>
    <div class="body" style="padding-bottom:8px"><div class="canvas"></div><div class="tools">
    <div class="row"><label class="chip"><input type="file" id="pick" accept="image/*"><span>選圖片</span></label><button class="chip drop">移除圖片</button></div>
    <textarea id="words" aria-label="文字" placeholder="寫下一句話"></textarea>
    <label class="slide img"><span>圖片大小</span><input type="range" id="isize" min="30" max="260" value="100"></label>
    <label class="slide txt"><span>文字大小</span><input type="range" id="tsize" min="4" max="18" step=".5" value="9"></label>
    <div class="row txt"><button class="chip" data-color="ink">深字</button><button class="chip" data-color="paper">白字</button><button class="chip plate">文字底色</button></div>
    <p class="err" role="alert"></p></div></div><div class="foot"><button class="primary">預覽</button></div></div>`);
  const close = open(v), canvas = $(".canvas", v), a = draft.art;
  let chosen = "text", moved = false;
  const isLong = () => !draft.imageUrl && draft.content.length > LONG;
  const ready = () => draft.imageUrl || draft.content.trim();
  function paint() {
    canvas.style.backgroundImage = draft.imageUrl ? (draft.tiny ? `linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.12)),url("${draft.tiny}")` : "") : wash(draft);
    if (isLong()) { const d = el('<div class="longtext"></div>'); d.textContent = draft.content; canvas.replaceChildren(d); }
    else {
      const art = artNode(draft); canvas.replaceChildren(art);
      if (!ready()) art.append(el('<div class="hint">圖片或文字</div>'));
      for (const [key, n] of [["image", $("img", art)], ["text", $("p", art)]]) {
        if (!n) continue;
        n.tabIndex = 0; n.setAttribute("role", "group"); n.setAttribute("aria-label", key === "image" ? "圖片，方向鍵移動" : "文字，方向鍵移動");
        n.classList.toggle("on", key === chosen && draft.imageUrl !== null);
        n.dataset.key = key;
        n.onkeydown = (e) => {
          const d = { ArrowLeft: [-2, 0], ArrowRight: [2, 0], ArrowUp: [0, -2], ArrowDown: [0, 2] }[e.key];
          if (!d) return;
          e.preventDefault(); e.stopPropagation(); move(key, d[0], d[1]); if (key === "text") moved = true;
          paint(); $(`[data-key=${key}]`, canvas).focus();
        };
      }
    }
    v.querySelectorAll(".img").forEach((n) => { n.hidden = !draft.imageUrl; });
    v.querySelectorAll(".txt").forEach((n) => { n.hidden = !draft.content.trim() || isLong(); });
    $(".drop", v).hidden = !draft.imageUrl;
    $(".chip span", v).textContent = draft.imageUrl ? "換圖片" : "選圖片";
    v.querySelectorAll("[data-color]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.color === a.text.color));
    $(".plate.chip", v).setAttribute("aria-pressed", a.text.plate);
    $(".primary", v).disabled = !ready();
  }
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  function move(key, dx, dy) { a[key].x = clamp(a[key].x + dx, 0, 100); a[key].y = clamp(a[key].y + dy, 0, 100); }

  const fingers = new Map();
  let grab = null;

      if (chosen === "text" && !draft.content.trim()) chosen = "image";
      grab = { x: e.clientX, y: e.clientY }; paint();
    } else grab = { pinch: spread(), size: chosen === "image" ? a.image.s : a.text.size };
  };
  canvas.onpointermove = (e) => {
    if (!fingers.has(e.pointerId) || !grab) return;
    fingers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      const size = grab.size * spread() / grab.pinch;
      if (chosen === "image") $("#isize", v).value = a.image.s = clamp(size, 30, 260); else $("#tsize", v).value = a.text.size = clamp(size, 4, 18);
    } else if (!grab.pinch) {
      const r = canvas.getBoundingClientRect();
      move(chosen, (e.clientX - grab.x) / r.width * 100, (e.clientY - grab.y) / r.height * 100);
      if (chosen === "text") moved = true;
      grab = { x: e.clientX, y: e.clientY };
    }
    paint();
  };
  canvas.onpointerup = canvas.onpointercancel = (e) => {
    fingers.delete(e.pointerId);
    const rest = [...fingers.values()][0]; grab = rest ? { ...rest } : null;
  };
  $("#pick", v).onchange = async (e) => {
    const file = e.target.files[0]; e.target.value = "";
    if (!file) return;
    $(".err", v).textContent = "";
    try {
      const { url, ratio } = await readImage(file);
      draft.imageUrl = url; draft.tiny = null; await shrink(draft);
      // Start with the whole image visible: never cropped unless the person enlarges it.
      a.image = { x: 50, y: 50, s: Math.min(100, 150 / ratio) };
      $("#isize", v).value = a.image.s; chosen = "image";
      if (!moved) { a.text.y = 82; a.text.plate = true; }
    } catch { $(".err", v).textContent = "這張圖片讀不到，請換一張"; }
    paint();
  };
  $(".drop", v).onclick = () => { draft.imageUrl = draft.tiny = null; if (!moved) { a.text.y = 50; a.text.plate = false; } chosen = "text"; paint(); };
  $("#words", v).oninput = (e) => { draft.content = e.target.value; if (draft.content.trim()) chosen = "text"; paint(); };
  $("#isize", v).oninput = (e) => { a.image.s = +e.target.value; chosen = "image"; paint(); };
  $("#tsize", v).oninput = (e) => { a.text.size = +e.target.value; chosen = "text"; paint(); };
  v.querySelectorAll("[data-color]").forEach((b) => { b.onclick = () => { a.text.color = b.dataset.color; paint(); }; });
  $(".plate.chip", v).onclick = () => { a.text.plate = !a.text.plate; paint(); };
  $(".round", v).onclick = () => {
    if (!ready()) { close(); return; }
    const s = el('<div class="scrim"><div class="sheet" role="alertdialog" aria-label="放棄編輯"><p>還沒加入，要放棄嗎？</p><button class="go">放棄</button><button class="keep">繼續編輯</button></div></div>');
    const shut = open(s); $(".keep", s).onclick = shut; $(".keep", s).focus();
    $(".go", s).onclick = () => { shut(); close(); };
  };
  v.onEscape = () => $(".round", v).click();
  $(".primary", v).onclick = () => {
    const c = { ...draft, content: draft.content.trim(), art: isLong() ? undefined : structuredClone(a) };
    const p = el(`<div class="view preview" role="dialog" aria-label="預覽"><div class="light"><div></div></div><div class="deck"></div><div class="acts"><button class="glass pill redo">${svg("edit")}修改</button><button class="glass pill save">${svg("check")}加入</button></div></div>`);
    $(".light div", p).style.backgroundImage = lightOf(c);
    $(".deck", p).append(node(c));
    const shut = open(p); $(".redo", p).onclick = shut; $(".save", p).focus({ preventScroll: true });
    $(".save", p).onclick = () => {
      const saved = { ...c, createdAt: Date.now() };
      cards = [...cards, saved]; shut(); close();
      if (top) addUnder(saved); else resetDeck(saved);
      toast("已加入");
    };
  };
  paint(); $(".round", v).focus({ preventScroll: true });
}

/* Stage */
function render() {
  document.querySelectorAll("[data-frame]").forEach((b) => b.setAttribute("aria-pressed", (b.dataset.frame === "off") === full));
  document.querySelectorAll("[data-env]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.env === env));
  document.body.classList.toggle("full", full); screenEl.classList.toggle("safari", env === "safari");
}
function resize() {
  scale = full ? 1 : Math.max(.4, Math.min(1, (innerHeight - fit.offsetTop - 14) / 872, (document.documentElement.clientWidth - 32) / 421));
  frame.style.transform = `translate(${8 * scale}px,4px) scale(${scale})`;
  fit.style.width = `${421 * scale}px`; fit.style.height = `${872 * scale}px`;
}
page.append(el('<div class="light"></div>'), el('<div class="deck"></div>'), el('<div class="edge er"></div>'), el('<div class="edge el"></div>'),
  el(glass("add", "新增", "corner add")), el(glass("no", "略過", "no")), el(glass("yes", "多看到", "yes")), el(glass("all", "收藏", "corner all")));
$(".no", page).onclick = () => swipeTop(-1); $(".yes", page).onclick = () => swipeTop(1);
$(".corner.all", page).onclick = openAll; $(".corner.add", page).onclick = openAdd;
document.querySelectorAll("[data-frame]").forEach((b) => { b.onclick = () => { full = b.dataset.frame === "off"; render(); resize(); }; });

addEventListener("keydown", (e) => {
  const view = [...page.children].filter((n) => n.onEscape).at(-1);
  if (view) { if (e.key === "Escape") view.onEscape(); return; }
  if (!e.repeat && e.key === "ArrowLeft") swipeTop(-1);
  if (!e.repeat && e.key === "ArrowRight") swipeTop(1);
});
addEventListener("resize", resize);
// A 4x5 copy of each image, scaled up, gives a soft light with no blur filter.
async function shrink(c) {

    const i = new Image(); i.src = c.imageUrl; await i.decode();
    const k = document.createElement("canvas"); k.width = 4; k.height = 5;
    k.getContext("2d").drawImage(i, 0, 0, 4, 5); c.tiny = k.toDataURL();
  } catch { /* keeps the full image as the light source */ }
}
render(); resize();
Promise.all(cards.filter((c) => c.imageUrl).map(shrink)).then(() => resetDeck(cards.find((c) => c.id === "demo-tide")));

})();
