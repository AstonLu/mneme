acct(){return head('',bk('coll'),`<button class="glass rd" aria-label="登出（原型不會登出）" disabled>${ic('leave')}</button>`)+`<div class="bd"><div style="display:grid;justify-items:center;margin-bottom:30px"><button data-pick="1" aria-label="更換頭像" style="border-radius:50%">${avatar(av,112,'pop')}</button><b style="font-size:26px;margin-top:10px">demo</b></div>${['ming','yu'].map((n,i)=>`<div class="member">${avatar(i?3:5,40)}<em>${n}</em><span class="lab">可刪卡</span><button class="sw" role="switch" aria-checked="${can[i]}" aria-label="${n} 可刪卡" data-can="${i}"><i></i></button></div>`).join('')}</div>${pick?`<div class="scrim"><div class="sheet"><div style="display:grid;justify-items:center">${avatar(av,120,'pop')}</div><div class="picks">${A.map((x,i)=>`<button data-av="${i}" aria-label="${x[0]}" aria-pressed="${i===av}">${avatar(i,84)}</button>`).join('')}</div><button class="go" data-done="1">完成</button></div></div>`:''}`}};
function fade(){const h=$('#layer .head h2');if(h)h.style.opacity=Math.max(0,1-($('#layer .bd')?.scrollTop||0)/28)}
$('#layer').addEventListener('scroll',fade,true);
function draw(){const o=$('#layer .bd')?.scrollTop||0,sl=$('.strip')?.scrollLeft||0;$('#layer').innerHTML=view?`<section class="view">${V[view]()}</section>`:'';if($('#layer .bd')){$('#layer .bd').scrollTop=o;fade()}if($('.strip'))$('.strip').scrollLeft=sl}
function fromLink(v){draft.link=v;let u;try{u=new URL(v)}catch{}const h=u&&/(^|\.)(x|twitter|threads)\.(com|net)$/.test(u.hostname)&&u.pathname.match(/^\/@?([\w.]+)/);draft.handle=h?h[1]:'';if(h)draft.k=u.hostname.includes('threads')?'thread':'tweet'}
document.addEventListener('input',e=>{const {id,value:v}=e.target;if(id==='txt'){if(/^https?:\/\/\S+$/.test(v.trim())){fromLink(v.trim());draft.t='';draw();$('#txt').focus();return}draft.t=v;$('.act').disabled=!(v.trim()||draft.img)}if(id==='f-name')draft.name=v;if(id==='f-link')fromLink(v)});
document.addEventListener('change',e=>{if(e.target.id!=='file'||!e.target.files[0])return;const f=new FileReader();f.onload=()=>{draft.img=f.result;draft.k='pic';draw()};f.readAsDataURL(e.target.files[0])});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(menu){menu=false;draw()}return}const d=b.dataset;
if('sw' in d)return swipe(+d.sw);
if('go' in d){view=d.go;menu=false;if(view==='add'){draft=mk('','plain',{name:'',handle:''});step='write';rows={}}else if(!view)deck()}
if(d.menu)menu=!menu;if(d.sort){sort=d.sort;menu=false}if(d.open){openId=+d.open;view='detail'}
if(d.tpl){if(view==='add')draft.k=d.tpl;else cards.find(c=>c.id===openId).k=d.tpl}
if(d.save){draft.t=draft.t.trim();cards.splice(at%cards.length,0,draft);at%=cards.length;view='';deck()}
if(d.step)step=d.step;if(d.row)rows[d.row]=true;if(d.clear){const k=d.clear;rows[k]=false;if(k==='img'){draft.img=null;draft.k='plain'}else if(k==='link')fromLink('');else draft.name=''}
if(d.pick)pick=true;if(d.done)pick=false;if(d.av)av=+d.av;if(d.can)can[d.can]=!can[d.can];
const sel=Object.entries(d).map(([k,v])=>`[data-${k}="${v}"]`)[0];draw();(d.go==='add'||d.step==='write'?$('#txt'):d.row?$('#f-'+d.row):$('#layer '+(sel||'x')))?.focus({preventScroll:true})});
document.addEventListener('keydown',e=>{if(!view&&e.key==='ArrowLeft')swipe(-1);if(!view&&e.key==='ArrowRight')swipe(1)});
$('.row3 .no').innerHTML=ic('no');$('.row3 .yes').innerHTML=ic('yes');$('.row3 .mk').innerHTML=mark();
deck();size();addEventListener('resize',size);new ResizeObserver(size).observe(document.documentElement);setInterval(size,400);
</script>

</body></html>
