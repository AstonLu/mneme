<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FA7859"/>
      <stop offset="1" stop-color="#ED682D"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFD39B"/>
      <stop offset="1" stop-color="#FFB979"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFEF9"/>
      <stop offset="1" stop-color="#FFF1E2"/>
    </linearGradient>
    <filter id="contact" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#field)"/>
  <rect x="249" y="217" width="424" height="565" rx="76" transform="rotate(-8 410 750)" fill="url(#back)"/>
  <rect x="290" y="218" width="414" height="552" rx="75" transform="rotate(13 410 750)" fill="#A63F22" opacity="0.18" filter="url(#contact)"/>
  <rect x="290" y="210" width="414" height="552" rx="75" transform="rotate(13 410 750)" fill="url(#front)"/>
</svg>
